<div class="container mt-5 p-4 shadow-lg rounded bg-light">
    <h2 class="text-center mb-4 text-primary">Add a New Appointment</h2>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group mb-3">
        <label for="name" class="form-label fw-bold">Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter name"
          class="form-control form-control-lg"
          [(ngModel)]="appointment.name"
          name="name"
        />
      </div>
      <div class="form-group mb-3">
        <label for="age" class="form-label fw-bold">Age</label>
        <input
          type="text"
          id="age"
          placeholder="Enter age"
          class="form-control form-control-lg"
          [(ngModel)]="appointment.age"
          name="age"
        />
      </div>
      <div class="form-group mb-3">
        <label for="symptoms" class="form-label fw-bold">Symptoms</label>
        <input
          type="text"
          id="symptoms"
          placeholder="Enter symptoms"
          class="form-control form-control-lg"
          [(ngModel)]="appointment.symtomps"
          name="symtomps"
        />
      </div>
      <div class="form-group mb-4">
        <label for="number" class="form-label fw-bold">Contact Number</label>
        <input
          type="text"
          id="number"
          placeholder="Enter contact number"
          class="form-control form-control-lg"
          [(ngModel)]="appointment.number"
          name="number"
        />
      </div>
      <div class="d-flex justify-content-between">
        <button type="button" class="btn btn-outline-primary btn-lg">
          <a [routerLink]="['/appointment']" class="text-decoration-none text-primary">Back</a>
        </button>
        <button type="submit" class="btn btn-success btn-lg">Submit Appointment</button>
      </div>
    </form>
  </div>
